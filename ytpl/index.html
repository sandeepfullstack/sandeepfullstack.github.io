<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Audio Player with Playlist and Speed Control</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .audio-player {
            background-color: #333;
            color: #fff;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .audio-player h2 {
            font-size: 18px;
            margin: 10px 0;
        }

        .controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
        }

        .controls button {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
        }

        .controls button:hover {
            color: #ff6347;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: #555;
            border-radius: 5px;
            margin-top: 10px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background-color: #ff6347;
            width: 0;
            border-radius: 5px;
        }

        .volume-container {
            margin-top: 15px;
        }

        input[type="range"] {
            width: 100%;
            background-color: #555;
            height: 5px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            background-color: #ff6347;
            border: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            cursor: pointer;
        }

        .title {
            margin-top: 15px;
            font-size: 16px;
            color: #ddd;
        }

        .time-info {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .playlist {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
            padding: 0;
            list-style: none;
            color: #ddd;
        }

        .playlist li {
            padding: 8px;
            cursor: pointer;
            text-align: left;
            border-bottom: 1px solid #444;
        }

        .playlist li:hover {
            background-color: #555;
        }

        .playlist li.active {
            background-color: #ff6347;
            color: #fff;
        }

        /* Media Query for smaller screens */
        @media (max-width: 600px) {
            .audio-player {
                padding: 15px;
            }

            .controls button {
                font-size: 22px;
            }

            .progress-container {
                height: 5px;
            }

            input[type="range"] {
                height: 4px;
            }
        }
    </style>
</head>

<body>

    <div class="audio-player">
        <h2>Audio Player</h2>
        <audio id="audio" preload="metadata"></audio>
        <div class="title" id="audioTitle">Track Title</div>

        <!-- Current time and total duration -->
        <div class="time-info">
            <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="prevBtn">⏮</button>
            <button id="playPauseBtn">►</button>
            <button id="nextBtn">⏭</button>
        </div>

        <!-- Progress bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Volume control -->
        <div class="volume-container">
            <label for="volumeSlider">Volume:</label>
            <input type="range" id="volumeSlider" value="40" max="100" />
        </div>

        <!-- Playback Speed Control -->
        <div class="speed-container">
            <label for="speedSelect">Speed:</label>
            <select id="speedSelect">
                <option value="0.5">0.5x</option>
                <option value="0.6">0.6x</option>
                <option value="0.7">0.7x</option>
                <option value="0.8">0.8x</option>
                <option value="0.9">0.9x</option>
                <option value="1" selected>1x</option>
                <option value="1.2">1.2x</option>
                <option value="1.3">1.3x</option>
                <option value="1.4">1.4x</option>
                <option value="1.5">1.5x</option>
                <option value="1.6">1.6x</option>
                <option value="1.7">1.7x</option>
                <option value="1.8">1.8x</option>
                <option value="1.9">1.9x</option>
                <option value="2">2x</option>
                <option value="2.1">2.1x</option>
                <option value="2.2">2.2x</option>
                <option value="2.3">2.3x</option>
                <option value="2.4">2.4x</option>
                <option value="2.5">2.5x</option>
                <option value="2.6">2.6x</option>
                <option value="2.7">2.7x</option>
                <option value="2.8">2.8x</option>
                <option value="2.9">2.9x</option>
                <option value="3">3x</option>
            </select>
        </div>

        <!-- Playlist -->
        <ul class="playlist" id="playlist"></ul>
    </div>

    <script>
        const audio = document.getElementById('audio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const volumeSlider = document.getElementById('volumeSlider');
        const title = document.getElementById('audioTitle');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationDisplay = document.getElementById('duration');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistContainer = document.getElementById('playlist');
        const speedSelect = document.getElementById('speedSelect');

        // Example list of tracks (replace with actual file paths)
        const BASE_PATH = 'https://raw.githubusercontent.com/sandeepfullstack/sandeepfullstack.github.io/master/book/PatanjalisYogaSutras';
        const tracks = [];
        const isDescending = false;
        const limit = 63;
        if (isDescending) {
            for (let index = limit; index >= 1; index--) {
                tracks.push({ src: `${BASE_PATH}/ch${index}.mp3`, title: `Chapter ${index}` });
            }
        } else {
            for (let index = 1; index <= limit; index++) {
                tracks.push({ src: `${BASE_PATH}/ch${index}.mp3`, title: `Chapter ${index}` });
            }
        }
        let currentTrackIndex = 0;

        // Function to load a track and update the speed
        function loadTrack(index) {
            const track = tracks[index];
            audio.src = track.src;
            title.textContent = track.title;
            audio.load();
            updateProgressBar();
            updateTimeDisplay();
            updatePlaybackSpeed();
            updatePlaylist();
            updateMediaSession();
        }

        // Function to update playback speed based on selection
        function updatePlaybackSpeed() {
            audio.playbackRate = parseFloat(speedSelect.value);
        }

        // Function to update Media Session metadata and actions
        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: title.textContent,
                    artist: 'Unknown Artist',
                    album: 'Album Name',
                    artwork: [
                        { src: 'path-to-your-artwork.jpg', sizes: '96x96', type: 'image/jpeg' },
                        { src: 'path-to-your-artwork.jpg', sizes: '128x128', type: 'image/jpeg' }
                    ]
                });

                // Register Media Session actions
                navigator.mediaSession.setActionHandler('play', togglePlayPause);
                navigator.mediaSession.setActionHandler('pause', togglePlayPause);
                navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            }
        }

        // Function to toggle play/pause
        function togglePlayPause() {
            if (audio.paused) {
                audio.play();
                playPauseBtn.textContent = '❚❚';
            } else {
                audio.pause();
                playPauseBtn.textContent = '►';
            }
        }

        // Function to update the progress bar
        function updateProgressBar() {
            const progress = (audio.currentTime / audio.duration) * 100;
            progressBar.style.width = progress + '%';
        }

        // Function to update the time display
        function updateTimeDisplay() {
            const current = formatTime(audio.currentTime);
            const duration = formatTime(audio.duration);
            currentTimeDisplay.textContent = current;
            durationDisplay.textContent = duration;
        }

        // Function to format time (hours:minutes:seconds)
        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            let time = minutes < 10 ? `0${minutes}` : minutes;
            time = hours > 0 ? `${hours}:${time}` : time;
            time = secs < 10 ? `${time}:0${secs}` : `${time}:${secs}`;
            return time;
        }

        // Function to change volume
        function changeVolume() {
            audio.volume = volumeSlider.value / 100;
        }

        // Function to seek to a specific time in the track
        function seekTo(e) {
            const width = progressContainer.offsetWidth;
            const clickPosition = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickPosition / width) * duration;
        }

        // Function to go to the next track
        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playPauseBtn.textContent = '❚❚';
        }

        // Function to go to the previous track
        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
            loadTrack(currentTrackIndex);
            audio.play();
            playPauseBtn.textContent = '❚❚';
        }

        // Function to update the playlist UI
        function updatePlaylist() {
            playlistContainer.innerHTML = '';
            tracks.forEach((track, index) => {
                const li = document.createElement('li');
                li.textContent = track.title;
                li.classList.remove('active'); // Remove active class from all
                if (index === currentTrackIndex) {
                    li.classList.add('active'); // Add active class to the current track
                }
                li.addEventListener('click', () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    audio.play();
                    playPauseBtn.textContent = '❚❚';
                });
                playlistContainer.appendChild(li);
            });
        }

        // Event listeners
        playPauseBtn.addEventListener('click', togglePlayPause);
        audio.addEventListener('timeupdate', updateProgressBar);
        audio.addEventListener('timeupdate', updateTimeDisplay);
        volumeSlider.addEventListener('input', changeVolume);
        progressContainer.addEventListener('click', seekTo);
        nextBtn.addEventListener('click', nextTrack);
        prevBtn.addEventListener('click', prevTrack);
        speedSelect.addEventListener('change', updatePlaybackSpeed);

        // Load the first track and playlist on page load
        loadTrack(currentTrackIndex);
        updatePlaylist();
    </script>

</body>

</html>
