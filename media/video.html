<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .media-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .media-item {
      background-color: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    video {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Video Library</h1>
  <div class="media-container" id="video-library">
    <!-- Video items will be inserted here dynamically -->
  </div>

  <script>
    async function loadMediaLibrary() {
      const response = await fetch('media-library.json');
      const data = await response.json();

      const videoContainer = document.getElementById('video-library');
      
      for (const [language, files] of Object.entries(data.media.videos)) {
        const languageDiv = document.createElement('div');
        languageDiv.classList.add('media-item');
        languageDiv.innerHTML = `<h2>${language.toUpperCase()}</h2>`;
        
        files.forEach(file => {
          const videoElement = document.createElement('video');
          const sourceElement = document.createElement('source');
          sourceElement.src = `media/video/${file}`;
          sourceElement.type = "video/mp4";
          videoElement.appendChild(sourceElement);
          videoElement.controls = true;
          languageDiv.appendChild(videoElement);
        });

        videoContainer.appendChild(languageDiv);
      }
    }

    loadMediaLibrary();
  </script>

</body>
</html>
