<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .media-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .media-item {
      background-color: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    a {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      color: #2c3e50;
    }
  </style>
</head>
<body>

  <h1>PDF Library</h1>
  <div class="media-container" id="pdf-library">
    <!-- PDF items will be inserted here dynamically -->
  </div>

  <script>
    async function loadMediaLibrary() {
      const response = await fetch('media-library.json');
      const data = await response.json();

      const pdfContainer = document.getElementById('pdf-library');
      
      for (const [language, files] of Object.entries(data.media.pdfs)) {
        const languageDiv = document.createElement('div');
        languageDiv.classList.add('media-item');
        languageDiv.innerHTML = `<h2>${language.toUpperCase()}</h2>`;
        
        files.forEach(file => {
          const pdfLink = document.createElement('a');
          pdfLink.href = `media/pdf/${file}`;
          pdfLink.target = "_blank";
          pdfLink.textContent = file;
          languageDiv.appendChild(pdfLink);
        });

        pdfContainer.appendChild(languageDiv);
      }
    }

    loadMediaLibrary();
  </script>

</body>
</html>
