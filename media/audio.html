<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Library</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f4f4;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    .media-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .media-item {
      background-color: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      text-align: center;
    }
    audio {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>Audio Library</h1>
  <div class="media-container" id="audio-library">
    <!-- Audio items will be inserted here dynamically -->
  </div>

  <script>
    async function loadMediaLibrary() {
      const response = await fetch('media-library.json');
      const data = await response.json();

      const audioContainer = document.getElementById('audio-library');
      
      for (const [language, files] of Object.entries(data.media.audios)) {
        const languageDiv = document.createElement('div');
        languageDiv.classList.add('media-item');
        languageDiv.innerHTML = `<h2>${language.toUpperCase()}</h2>`;
        // languageDiv.appendChild('<a href="audioPlayer/index.html?file_name=/JSON/HanumanChalisaVikrantSinghTomar.json">Hanuman Chalisa</a>');
        files.forEach(file => {
          console.log(file);
          const anchorElement = document.createElement('a');
      anchorElement.href = `media/pdf/${file}`; // Path to the PDF
      anchorElement.target = "_blank"; // Open in a new tab
      anchorElement.textContent = file; // Display the file name as the link text
      languageDiv.appendChild(anchorElement);
      
          /* const audioElement = document.createElement('audio');
          const sourceElement = document.createElement('source');
          sourceElement.src = `media/audio/${file}`;
          sourceElement.type = "audio/mp3";
          audioElement.appendChild(sourceElement);
          languageDiv.appendChild(audioElement); */
        });

        audioContainer.appendChild(languageDiv);
      }
    }

    loadMediaLibrary();
  </script>

</body>
</html>
